name: (temporal) Chequear vista profesionales_publico

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la vista con la anon key (pública)
        run: |
          ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcWV0aXljb2RwZmhvZXF3Z3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTE5MDUsImV4cCI6MjA5MjM4NzkwNX0.wwjZsLU3sDVhqM4138xTdg8gmf_lDDKJXKRtb0N1k40'
          BASE='https://sqqetiycodpfhoeqwguv.supabase.co/rest/v1'
          echo "=== Vista profesionales_publico ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            "$BASE/profesionales_publico?select=id,slug,nombre&limit=1" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON"
          echo
          echo "=== Tabla profesionales (debe seguir bloqueada para anon) ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            "$BASE/profesionales?select=id&limit=1" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON"
